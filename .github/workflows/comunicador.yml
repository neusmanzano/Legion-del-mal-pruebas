# This is a basic workflow to help you get started with Actions

name: Comunicador de la legion

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Qué villano  envia el mensaje?"
        required: true
        type: choice
        options: 
          - Lex Luthor
          - Magneto
          - Jocker
      
      mensaje:
        description: "mensaje para el consejo" 
        required: true
        default: "La misión fue un éxito"

      cawcaracters:
        description: "imagen del mensaje"
        required: true
        default: "imagen del caw"
        type: choice
        options:
          - eyes
          - ghostbusters
          - dragon
          - fox
          - kitten

      prioridad:
        description: "¿Qué villano  envia el mensaje?"
        required: true
        type: choice
        options: 
          - 🔵 Baja
          - 🟢 Media
          - 🔴 Alta


jobs:

  transmitir-mensaje:

    runs-on: ubuntu-latest

    steps:
      - name: Instalar el transmisor de la legión
        run: sudo apt-get install -y cowsay

      - name: Imprimir inputs
        run: |
          echo "Imprimir inputs: "
          echo "============================="
          echo "  Transmisión interceptada   "
          echo "============================="
          echo ""
          echo "De: ${{ inputs.villano}}"
          echo ""
          echo "Fecha: $(date -u +"%d/%m/%Y - %H:%M UTC")"
          echo "----- Mensaje -----"
          # cowsay -f eyes "${{ inputs.mensaje }}"
          cowsay -f ${{ inputs.cawcaracters}}
          echo ""
          echo "--- ${{ inputs.villano }}"
          echo " ......"

      #- name: Imprimir inputs
        #run: |
          #echo "Inputs: "
          #echo ""
          #echo "villano ${{ inputs.villano}}"
          #echo "nivel ${{ inputs.prioridad}}"
          #echo "mensaje ${{ inputs.mensaje}}"